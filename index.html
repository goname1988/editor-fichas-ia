<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA Propiedades — Editor de fichas</title>
<style>
  /* autodeploy-ok: publicado via GitHub->Netlify */
  :root{
    --navy:#1B2A3F; --blue:#2E4A6B; --gray:#8DA4BE; --white:#F0F3F6;
    --ok:#2E7D32; --err:#C62828;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    background:var(--white); color:var(--navy); font-size:14px;
  }
  /* Los campos que se escriben (inputs/selects/textareas) y los botones se
     mantienen en 16px por comodidad, aunque el resto de la interfaz (labels,
     titulos, texto de checkboxes) haya bajado a 14px para que entre mas
     contenido en pantalla. */
  button, input, select, textarea{ font-family:inherit; font-size:16px; }
  .radio-card{ font-size:16px; }
  h1,h2,h3{ margin:0; }
  .hidden{ display:none !important; }

  /* Header */
  .app-header{
    background:var(--navy); color:var(--white);
    padding:10px 18px; display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:10px; position:sticky; top:0; z-index:50;
  }
  .app-logo{ font-size:14px; letter-spacing:.18em; font-weight:700; }
  .app-logo span{ color:var(--gray); font-weight:400; letter-spacing:.08em; }
  .app-actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .app-actions button{
    min-height:44px; padding:0 14px; border-radius:8px; border:1px solid var(--gray);
    background:var(--blue); color:var(--white); cursor:pointer; font-weight:500;
  }
  .app-actions button.secondary{ background:transparent; border:1px solid var(--gray); color:var(--white); }
  .app-actions button:hover{ opacity:.9; }
  .save-indicator{ font-size:13px; padding:4px 10px; border-radius:20px; font-weight:500; min-width:96px; text-align:center; }
  .save-indicator.ok{ background:rgba(76,175,80,.15); color:#8BE28E; }
  .save-indicator.err{ background:rgba(198,40,40,.2); color:#FF9E9E; }
  .save-indicator.idle{ background:rgba(255,255,255,.08); color:var(--gray); }

  /* Layout */
  .layout{
    display:grid; grid-template-columns:260px 1fr 420px; gap:0;
    height:calc(100vh - 64px); min-height:600px;
  }
  .col{ overflow-y:auto; }
  .col-list{ background:#E6ECF2; border-right:1px solid var(--gray); padding:14px; }
  .col-form{ padding:18px 22px 60px; }
  .col-preview{ background:#DCE4EC; border-left:1px solid var(--gray); padding:14px; display:flex; flex-direction:column; }

  .btn-new{
    width:100%; min-height:48px; background:var(--navy); color:var(--white);
    border:none; border-radius:8px; font-weight:600; font-size:16px; cursor:pointer; margin-bottom:14px;
  }
  .btn-new:hover{ opacity:.92; }

  .ficha-item{
    background:var(--white); border:1px solid var(--gray); border-radius:8px;
    padding:10px 12px; margin-bottom:8px; cursor:pointer; position:relative;
  }
  .ficha-item.active{ border-color:var(--navy); box-shadow:0 0 0 2px var(--navy) inset; }
  .ficha-item .fi-title{ font-weight:600; font-size:14px; margin-bottom:2px; }
  .ficha-item .fi-sub{ font-size:12px; color:var(--blue); }
  .ficha-item .fi-del{
    position:absolute; top:6px; right:6px; background:none; border:none;
    color:var(--err); font-size:16px; cursor:pointer; padding:4px 8px;
  }
  .empty-list{ font-size:13px; color:var(--blue); text-align:center; padding:20px 6px; }

  /* Form sections */
  .section{
    background:var(--white); border:1px solid var(--gray); border-radius:10px;
    margin-bottom:14px; overflow:hidden;
  }
  .section-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; cursor:pointer; user-select:none;
  }
  .section-head h2{ font-size:14px; font-weight:600; }
  .section-head .chevron{ font-size:14px; color:var(--blue); transition:transform .15s; }
  .section.collapsed .chevron{ transform:rotate(-90deg); }
  .section-body{ padding:0 16px 16px; }
  .section.collapsed .section-body{ display:none; }
  .section-hint{ font-size:13px; color:var(--blue); margin-bottom:12px; line-height:1.4; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:13px; font-weight:600; color:var(--blue); margin-bottom:6px; }
  .field .tip{ font-weight:400; color:var(--gray); cursor:help; margin-left:4px; }
  .field input[type=text], .field input[type=number], .field select, .field textarea{
    width:100%; min-height:44px; padding:8px 12px; border:1px solid var(--gray);
    border-radius:8px; background:#fff; color:var(--navy);
  }
  .field textarea{ min-height:88px; resize:vertical; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .row3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }

  .radio-group{ display:flex; gap:10px; flex-wrap:wrap; }
  .radio-card{
    flex:1; min-width:130px; border:2px solid var(--gray); border-radius:10px;
    padding:14px 10px; text-align:center; cursor:pointer; font-weight:600; min-height:44px;
  }
  .radio-card.selected{ border-color:var(--navy); background:#EEF2F6; }
  .radio-card input{ display:none; }

  .check-row{ display:flex; align-items:center; gap:10px; min-height:44px; }
  .check-row input[type=checkbox]{ width:22px; height:22px; flex-shrink:0; }
  .check-row label{ font-weight:500; color:var(--navy); }
  .check-row svg{ width:22px; height:22px; stroke:var(--blue); flex-shrink:0; }

  .icon-field{ display:flex; align-items:center; gap:10px; }
  .icon-field svg{ width:22px; height:22px; stroke:var(--blue); flex-shrink:0; }

  .dyn-row{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .dyn-row input{ flex:1; }
  .btn-x{
    width:40px; height:40px; border-radius:8px; border:1px solid var(--err); background:#fff;
    color:var(--err); font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .btn-add{
    min-height:44px; padding:0 16px; border-radius:8px; border:1px dashed var(--blue);
    background:#fff; color:var(--blue); cursor:pointer; font-weight:600; margin-top:4px;
  }

  .amenities-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; margin-top:8px; }

  .detalle-group{ margin-bottom:18px; }
  .detalle-group:last-child{ margin-bottom:0; }
  .detalle-group-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .detalle-group-head svg{ width:20px; height:20px; stroke:var(--navy); flex-shrink:0; }
  .detalle-group-head h3{ font-size:14px; font-weight:600; color:var(--navy); }
  .detalle-num-input{ width:64px; min-height:44px; flex-shrink:0; padding:4px 8px; border:1px solid var(--gray); border-radius:6px; background:#fff; color:var(--navy); text-align:center; font-size:16px; }

  .map-preview iframe{ width:100%; height:200px; border:0; border-radius:8px; border:1px solid var(--gray); }
  .map-geocode-status{ font-size:13px; margin:8px 0; min-height:18px; color:var(--blue); font-weight:600; }
  .map-geocode-status.ok{ color:var(--ok); }
  .map-geocode-status.err{ color:var(--err); }
  .map-geocode-status.busy{ color:var(--blue); }

  /* Photos */
  .photo-toggle{ display:flex; gap:8px; margin-bottom:12px; }
  .photo-toggle button{
    flex:1; min-height:44px; border-radius:8px; border:1px solid var(--gray); background:#fff;
    color:var(--navy); cursor:pointer; font-weight:600;
  }
  .photo-toggle button.active{ background:var(--navy); color:var(--white); border-color:var(--navy); }
  .photo-count{ font-size:13px; color:var(--blue); margin-bottom:8px; font-weight:600; }
  .photo-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .photo-thumb{
    position:relative; border:2px solid var(--gray); border-radius:8px; overflow:hidden;
    aspect-ratio:4/3; cursor:grab; background:#dde5ec;
  }
  .photo-thumb.main{ border-color:var(--navy); box-shadow:0 0 0 2px var(--navy); }
  .photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-thumb .pt-actions{
    position:absolute; inset:auto 0 0 0; display:flex; gap:4px; padding:4px;
    background:rgba(27,42,63,.75);
  }
  .photo-thumb .pt-actions button{
    flex:1; font-size:11px; padding:4px; border:none; border-radius:4px; cursor:pointer;
  }
  .photo-thumb .pt-main{ background:#fff; color:var(--navy); }
  .photo-thumb .pt-del{ background:var(--err); color:#fff; }
  .photo-thumb .pt-badge{
    position:absolute; top:4px; left:4px; background:var(--navy); color:#fff; font-size:10px;
    padding:2px 6px; border-radius:10px;
  }

  /* Preview column */
  .preview-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .preview-head h2{ font-size:14px; color:var(--blue); text-transform:uppercase; letter-spacing:.08em; }
  .preview-frame-wrap{ flex:1; background:#fff; border-radius:12px; overflow:hidden; border:1px solid var(--gray); }
  .preview-frame-wrap iframe{ width:100%; height:100%; border:0; }

  /* Mobile tabs */
  .mobile-tabs{ display:none; }
  @media (max-width: 980px){
    .app-actions .app-actions-text{ display:none; }
    .layout{ display:block; height:auto; }
    .col{ display:none; height:auto; }
    .col.active-tab{ display:block; }
    .col-preview{ min-height:70vh; }
    .mobile-tabs{
      display:flex; position:sticky; top:56px; z-index:40; background:var(--navy);
    }
    .mobile-tabs button{
      flex:1; min-height:44px; background:none; border:none; color:var(--gray);
      font-weight:600; border-bottom:3px solid transparent; cursor:pointer;
    }
    .mobile-tabs button.active{ color:#fff; border-bottom-color:var(--white); }
  }

  /* Toast / confirm modal */
  .modal-backdrop{
    display:none; position:fixed; inset:0; background:rgba(27,42,63,.6); z-index:200;
    align-items:center; justify-content:center; padding:20px;
  }
  .modal-backdrop.active{ display:flex; }
  .modal-box{ background:#fff; border-radius:12px; padding:22px; max-width:400px; width:100%; }
  .modal-box p{ margin-bottom:18px; color:var(--blue); font-size:15px; }
  .modal-box .modal-actions{ display:flex; gap:10px; justify-content:flex-end; }
  .modal-box button{ min-height:44px; padding:0 18px; border-radius:8px; cursor:pointer; font-weight:600; border:1px solid var(--gray); background:#fff; }
  .modal-box button.danger{ background:var(--err); color:#fff; border-color:var(--err); }
  .modal-box button.confirm{ background:var(--navy); color:#fff; border-color:var(--navy); }

  /* --- Integración CRM + Netlify (secciones 15 y 16) --- */
  .privacy-note{
    background:#FFF9E6; border:1px solid #F5D073; color:#7A5A00;
    padding:10px 12px; border-radius:8px; font-size:14px; margin-bottom:14px; line-height:1.4;
  }
  .propietario-picker{ display:flex; gap:8px; align-items:stretch; flex-wrap:wrap; }
  .propietario-picker select{
    flex:1 1 260px; min-height:44px; padding:0 12px; font-size:16px;
    border:1px solid var(--gray); border-radius:8px; background:#fff;
  }
  .btn-add-inline{
    min-height:44px; padding:0 14px; border:1px solid var(--navy); background:#fff; color:var(--navy);
    border-radius:8px; font-weight:600; cursor:pointer; font-size:14px;
  }
  .btn-add-inline:hover{ background:var(--navy); color:#fff; }
  .field-row{ display:flex; gap:12px; flex-wrap:wrap; }
  .field-row .field{ flex:1 1 200px; }
  .crm-warn{
    background:#FDECEC; border:1px solid #E5A0A0; color:#8A1F1F;
    padding:10px 12px; border-radius:8px; font-size:14px; margin:12px 0; line-height:1.4;
  }
  .crm-actions{ display:flex; align-items:center; gap:12px; margin-top:12px; }
  .btn-crm{
    min-height:44px; padding:0 22px; border:1px solid var(--navy); background:var(--navy); color:#fff;
    border-radius:8px; font-weight:700; cursor:pointer; font-size:16px;
  }
  .btn-crm:hover:not([disabled]){ background:var(--blue); border-color:var(--blue); }
  .btn-crm[disabled]{ opacity:0.5; cursor:not-allowed; background:var(--gray); border-color:var(--gray); }
  .crm-spinner{ color:var(--blue); font-size:14px; font-weight:600; }
  .crm-spinner.hidden{ display:none; }
  .crm-badge{
    margin-top:14px; padding:12px 14px; border-radius:8px; font-size:14px; line-height:1.5;
    display:block;
  }
  .crm-badge.ok{ background:#E8F5E9; border:1px solid #81C784; color:#1B5E20; }
  .crm-badge.err{ background:#FDECEC; border:1px solid #E5A0A0; color:#8A1F1F; }
  .crm-badge a{ color:inherit; text-decoration:underline; word-break:break-all; }
  .crm-hint{ display:block; font-size:13px; opacity:0.85; margin-top:4px; font-weight:normal; }
  .btn-copy-url{
    background:transparent; border:none; cursor:pointer; font-size:16px; padding:2px 6px;
    vertical-align:middle;
  }
  .sub-hint{ font-size:13px; color:var(--blue); margin-top:4px; }
  .sub-hint code{ background:#F0F3F6; padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>

<div class="app-header">
  <div class="app-logo">IA <span>PROPIEDADES</span> · Editor de fichas</div>
  <div class="app-actions">

<script>
/* ======================= CONFIG API (CRM + Netlify) =======================
   Endpoints externos que usa el editor. Cambiar acá si se rota el token
   o se re-deploya el web app de Apps Script (la URL /exec cambia con cada
   deploy NUEVO — pero al hacer "Manage deployments → editar existente → New
   version" la URL se preserva).
   El API_TOKEN va en el body de cada POST y se valida server-side contra
   PropertiesService.getScriptProperties().getProperty('API_TOKEN'). Si se
   filtra, se rota en Script Properties y acá.
   La Netlify Function corre en el mismo dominio del editor, así que la URL
   relativa /.netlify/functions/deploy funciona sin CORS.
=========================================================================== */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwsrzMreBFEALsiWvWfJcq1ITldZnibMlhiHz9R3tEyKuX9gtBFnyAOdXDbXZvqQ1LbJA/exec';
const API_TOKEN = '60b098c8cac6b855f7e8c46b723f508745e8ac344625a3b2';  // debe coincidir con Script Properties del web app CRM; rotar si se filtra
const NETLIFY_DEPLOY_FN = '/.netlify/functions/deploy';
const PROPIETARIOS_CACHE_KEY = 'ia_propietarios_cache';
const PROPIETARIOS_CACHE_TTL_MS = 5 * 60 * 1000;  // 5 minutos

/* ======================= STATE & STORAGE ======================= */
// Las fichas (con fotos) se guardan en IndexedDB, que aguanta cientos de MB
// (localStorage solo ~5MB, se llenaba con pocas fotos). Las claves chicas
// (currentId, contador de código, fecha de autobackup) siguen en localStorage.
const STORAGE_KEY = 'ia_fichas_v1';       // clave vieja de localStorage (para migrar)
const LAST_ID_KEY = 'ia_fichas_last_id';
const CODIGO_COUNTER_KEY = 'ia_fichas_codigo_counter';
const IDB_NAME = 'ia_fichas_db';
const IDB_STORE = 'kv';
const IDB_FICHAS_KEY = 'fichas';

let _idbPromise = null;
function idbOpen(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error('no-indexeddb')); return; }
    let req;
    try{ req = indexedDB.open(IDB_NAME, 1); }
    catch(e){ reject(e); return; }
    req.onupgradeneeded = ()=>{ try{ req.result.createObjectStore(IDB_STORE); }catch(e){} };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error || new Error('idb-open'));
  });
  return _idbPromise;
}
function idbGet(key){
  return idbOpen().then(db=> new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  }));
}
function idbSet(key, value){
  return idbOpen().then(db=> new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  }));
}

// Guarda el array de fichas. Preferencia: IndexedDB (gran capacidad). Si no está
// disponible por algún motivo, cae a localStorage para no romper (con su límite).
async function guardarFichasStorage(){
  try{
    await idbSet(IDB_FICHAS_KEY, fichas);
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} // ya migrado, liberar
    return;
  }catch(e){
    // Fallback (puede fallar por tamaño con muchas fotos)
    localStorage.setItem(STORAGE_KEY, JSON.stringify(fichas));
  }
}

// Carga las fichas. Lee de IndexedDB; si está vacío pero hay datos viejos en
// localStorage, los migra a IndexedDB una vez.
async function cargarFichasStorage(){
  try{
    const data = await idbGet(IDB_FICHAS_KEY);
    if(Array.isArray(data)) return data;
  }catch(e){}
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const arr = JSON.parse(raw);
      if(Array.isArray(arr)){
        try{ await idbSet(IDB_FICHAS_KEY, arr); localStorage.removeItem(STORAGE_KEY); }catch(e){}
        return arr;
      }
    }
  }catch(e){}
  return [];
}

// Código automático correlativo por ficha (IA-0001, IA-0002...). El contador
// vive en localStorage de esta compu. Se puede editar a mano en el formulario
// si se quiere usar el código del propio sistema de la inmobiliaria.
function nextCodigo(){
  let n = parseInt(localStorage.getItem(CODIGO_COUNTER_KEY) || '0', 10);
  if(isNaN(n)) n = 0;
  n += 1;
  try{ localStorage.setItem(CODIGO_COUNTER_KEY, String(n)); }catch(e){}
  return 'IA-' + String(n).padStart(4, '0');
}

const BARRIOS = ["Aires Puros","Brazo Oriental","Colón","Ituzaingó","La Blanqueada",
  "Malvín Norte","Pocitos","Unión","Cordón","Centro","Punta Carretas","Buceo",
  "Malvín","Prado","Parque Batlle"];

const AMENITIES_COMUNES = ["Piscina exterior","Piscina climatizada","Gimnasio",
  "Portería 24hs","Salón de fiestas","Barbacoa","Parrilleros","Sauna","Solárium",
  "Playroom","Sala de juegos","Coworking","Jardines","Bicicletero",
  "Piscina al aire libre","Piscina cubierta","Canchas deportivas","Salón comunal",
  "Calefacción","Aire acondicionado","Lavandería"];

// Garantías de alquiler aceptadas (solo se muestran cuando la operación es
// "Alquiler"). Lista base + posibilidad de agregar otras custom por ficha.
const GARANTIAS_COMUNES = ["Porto Seguro","Depósito","Sura","Sancor",
  "CGN (Contaduría General de la Nación)","ANDA","MAPFRE"];

// Datos de LOCAL comercial (solo se muestran cuando tipoPropiedad === 'local').
// Aplica tanto a venta como a alquiler.
const CONSERVACION_OPCIONES = ["Excelente","Muy bueno","Bueno","Reparaciones simples","A reciclar"];
const TECHO_OPCIONES = ["De material","Liviano","Mixto"];

function initLocal(){
  return {
    supEdificada:'', supTerreno:'', supSalon:'', alturaSalon:'', frente:'',
    conservacion:'', techo:'', plantas:'',
    salones:'', oficinas:'', entradaVehiculos:'', aptoProfesional:'',
    gastosComunes:'',
    vidriera:false, sobreAvenida:false, accesibilidad:false
  };
}

function ensureLocal(f){
  const def = initLocal();
  if(!f.local || typeof f.local !== 'object' || Array.isArray(f.local)) f.local = {};
  Object.keys(def).forEach(k=>{ if(f.local[k] === undefined) f.local[k] = def[k]; });
}

let fichas = [];
let currentId = null;
let dirty = false;

/* ======================= PHOTO COMPRESSION ======================= */
// Fotos "Subir desde PC" se re-codifican en el navegador antes de guardarlas:
// se limita el lado mas largo a PHOTO_MAX_DIM px y se recomprime como JPEG a
// PHOTO_QUALITY. Esto evita fichas de 30+ MB (fotos de celular sin comprimir)
// sin que se note perdida de calidad en pantalla (el hero de la ficha final
// nunca se muestra a mas de 640px de ancho).
const PHOTO_MAX_DIM = 1920;
const PHOTO_QUALITY = 0.9;

function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('No se pudo leer el archivo'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('No se pudo decodificar la imagen'));
      img.onload = ()=>{
        let width = img.naturalWidth || img.width;
        let height = img.naturalHeight || img.height;
        if(!width || !height){ reject(new Error('Imagen inválida')); return; }
        if(width > maxDim || height > maxDim){
          if(width >= height){ height = Math.round(height * (maxDim / width)); width = maxDim; }
          else { width = Math.round(width * (maxDim / height)); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        let dataUrl;
        try{ dataUrl = canvas.toDataURL('image/jpeg', quality); }
        catch(err){ reject(err); return; }
        // Si por algún motivo la version comprimida no achica el archivo
        // (fotos ya livianas, capturas de pantalla, etc.) se usa el original.
        if(dataUrl.length >= reader.result.length){ resolve(reader.result); }
        else { resolve(dataUrl); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Backwards-compat: agregar campos nuevos a fichas viejas cargadas de IDB
function ensurePropietarioYEstados(f){
  if(!f.propietario || typeof f.propietario!=='object'){
    f.propietario = { nombre:'', tel:'', email:'', ownerId:'' };
  } else {
    if(f.propietario.nombre==null) f.propietario.nombre = '';
    if(f.propietario.tel==null) f.propietario.tel = '';
    if(f.propietario.email==null) f.propietario.email = '';
    if(f.propietario.ownerId==null) f.propietario.ownerId = '';
  }
  if(f.crmEnviado==null) f.crmEnviado = false;
  if(f.crmPropId==null) f.crmPropId = '';
  if(f.crmEnviadoAt==null) f.crmEnviadoAt = 0;
  if(f.crmActualizadoAt==null) f.crmActualizadoAt = 0;
  if(f.crmError==null) f.crmError = '';
  if(f.netlifyPublicado==null) f.netlifyPublicado = false;
  if(f.netlifyUrl==null) f.netlifyUrl = '';
  if(f.netlifySubdominio==null) f.netlifySubdominio = '';
  if(f.netlifyPublicadoAt==null) f.netlifyPublicadoAt = 0;
  if(f.netlifyError==null) f.netlifyError = '';
}

async function loadFichas(){
  fichas = await cargarFichasStorage();
  fichas.forEach(ensureCaracteristicasDetalladas);
  fichas.forEach(ensurePropietarioYEstados);
  // Fichas viejas sin código: se les asigna uno automático y se persiste una
  // sola vez (si no se persistiera, cambiaría en cada apertura).
  let codigoAsignado = false;
  fichas.forEach(f=>{
    if(!f.codigo || !String(f.codigo).trim()){ f.codigo = nextCodigo(); codigoAsignado = true; }
  });
  const lastId = localStorage.getItem(LAST_ID_KEY);
  if(fichas.length){
    currentId = fichas.find(f=>f.id===lastId) ? lastId : fichas[0].id;
  } else {
    currentId = null;
  }
  if(codigoAsignado){
    try{ await guardarFichasStorage(); }catch(e){}
  }
}

function persist(){
  if(currentId){ try{ localStorage.setItem(LAST_ID_KEY, currentId); }catch(e){} }
  guardarFichasStorage().then(()=>{
    setSaveIndicator('ok');
    maybeAutoBackup();
  }).catch(()=>{
    setSaveIndicator('err');
  });
}

function setSaveIndicator(state){
  const el = document.getElementById('saveIndicator');
  el.classList.remove('ok','err','idle');
  if(state==='ok'){ el.classList.add('ok'); el.textContent = 'Guardado ✓'; }
  else if(state==='err'){ el.classList.add('err'); el.textContent = 'Error al guardar'; }
  else { el.classList.add('idle'); el.textContent = 'Sin cambios'; }
}

function getCurrent(){ return fichas.find(f=>f.id===currentId) || null; }

function markDirty(){ dirty = true; setSaveIndicator('idle'); }

function detalleItemType(it){ return it.type === 'number' ? 'number' : 'checkbox'; }
function detalleItemDefault(it){ return detalleItemType(it)==='number' ? 0 : false; }

function initCaracteristicasDetalladas(){
  const obj = {};
  DETALLE_GROUPS.forEach(g=>{
    obj[g.key] = {};
    g.items.forEach(it=>{ obj[g.key][it.key] = detalleItemDefault(it); });
  });
  return obj;
}

function ensureCaracteristicasDetalladas(f){
  if(typeof f.videoUrl !== 'string') f.videoUrl = '';
  if(typeof f.referenciaMapa !== 'string') f.referenciaMapa = '';
  if(!Array.isArray(f.garantias)) f.garantias = [];
  if(!Array.isArray(f.garantiasCustom)) f.garantiasCustom = [];
  if(f.tipoPropiedad!=='casa' && f.tipoPropiedad!=='apartamento' && f.tipoPropiedad!=='local') f.tipoPropiedad = 'apartamento';
  ensureLocal(f);
  if(typeof f.subtipoApartamento !== 'string') f.subtipoApartamento = '';
  if(typeof f.disposicion !== 'string') f.disposicion = '';
  if(typeof f.cantidadPisos !== 'string' && typeof f.cantidadPisos !== 'number') f.cantidadPisos = '';
  if(typeof f.aptosPorPiso !== 'string' && typeof f.aptosPorPiso !== 'number') f.aptosPorPiso = '';
  if(typeof f.porteriaHorario !== 'string') f.porteriaHorario = '';
  if(typeof f.seguridad !== 'string') f.seguridad = '';
  if(typeof f.gastosComunes !== 'string') f.gastosComunes = '';
  if(typeof f.mapLat !== 'number') f.mapLat = null;
  if(typeof f.mapLng !== 'number') f.mapLng = null;
  if(!f.caracteristicasDetalladas) f.caracteristicasDetalladas = initCaracteristicasDetalladas();
  DETALLE_GROUPS.forEach(g=>{
    if(!f.caracteristicasDetalladas[g.key]) f.caracteristicasDetalladas[g.key] = {};
    g.items.forEach(it=>{
      const cur = f.caracteristicasDetalladas[g.key][it.key];
      if(detalleItemType(it)==='number'){
        if(typeof cur === 'boolean'){ f.caracteristicasDetalladas[g.key][it.key] = cur ? 1 : 0; }
        else if(typeof cur !== 'number' || isNaN(cur)){ f.caracteristicasDetalladas[g.key][it.key] = 0; }
      } else {
        if(typeof cur !== 'boolean'){ f.caracteristicasDetalladas[g.key][it.key] = !!cur; }
      }
    });
  });
}

/* ======================= FORM RENDER ======================= */
const collapsedSections = new Set();

function slugify(s){
  return (s||'').toString().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}

// Si hay una referencia de cruce de calles cargada, el mapa centra ahí (zoom
// mas cercano, 16) en vez del barrio en general (zoom 14). Nunca se usa la
// direccion exacta — sigue siendo una aproximacion, solo mas precisa.
function mapQueryText(f){
  const ref = (f.referenciaMapa || '').trim();
  return `${ref || f.barrio}, ${f.ciudad}, Uruguay`;
}

// Si ya tenemos coordenadas geocodificadas (f.mapLat/f.mapLng), el mapa se
// centra ahi SIN pin (ll=). Si todavia no se geocodifico (o fallo), cae al
// comportamiento anterior con pin (q=) para que el mapa nunca se rompa.
function mapEmbedSrc(f){
  const ref = (f.referenciaMapa || '').trim();
  const zoom = ref ? 16 : 14;
  if(typeof f.mapLat === 'number' && typeof f.mapLng === 'number'){
    return `https://www.google.com/maps?ll=${f.mapLat},${f.mapLng}&z=${zoom}&t=m&output=embed`;
  }
  const query = encodeURIComponent(mapQueryText(f));
  return `https://www.google.com/maps?q=${query}&z=${zoom}&output=embed`;
}

// Geocodificacion gratuita via OpenStreetMap Nominatim (sin API key). Se usa
// UNA sola vez por ficha, al cargarla en el editor (nunca en la ficha ya
// publicada) — uso puntual y respetuoso de su politica de uso gratuito.
async function geocodeQuery(texto){
  try{
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=uy&q=${encodeURIComponent(texto)}`;
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    if(!res.ok) return null;
    const data = await res.json();
    if(!Array.isArray(data) || !data.length) return null;
    const lat = parseFloat(data[0].lat);
    const lng = parseFloat(data[0].lon);
    if(isNaN(lat) || isNaN(lng)) return null;
    return { lat, lng };
  }catch(err){
    return null;
  }
}

function setMapGeocodeStatus(text, cls){
  const el = document.getElementById('mapGeocodeStatus');
  if(!el) return;
  el.textContent = text;
  el.className = 'map-geocode-status' + (cls ? ' ' + cls : '');
}

async function buscarUbicacionMapa(f){
  const query = mapQueryText(f).trim();
  if(!query || query === `, ${f.ciudad}, Uruguay`){
    setMapGeocodeStatus('Cargá al menos el barrio para poder ubicar el mapa.', 'err');
    return;
  }
  setMapGeocodeStatus('Buscando ubicación…', 'busy');
  const result = await geocodeQuery(query);
  // Si el usuario siguio escribiendo mientras esperabamos la respuesta, no
  // pisamos con un resultado viejo — solo aplicamos si la ficha sigue activa.
  if(getCurrent() !== f) return;
  if(result){
    f.mapLat = result.lat;
    f.mapLng = result.lng;
    setMapGeocodeStatus('Ubicación encontrada ✓', 'ok');
  } else {
    f.mapLat = null;
    f.mapLng = null;
    setMapGeocodeStatus('No se encontró esa ubicación, se muestra el mapa por barrio (con pin).', 'err');
  }
  onFichaChanged();
  updateMapPreview(f);
}

function sectionWrap(key, title, bodyHtml){
  const collapsed = collapsedSections.has(key) ? 'collapsed' : '';
  return `<div class="section ${collapsed}" data-section-key="${key}">
    <div class="section-head" data-toggle-section="${key}">
      <h2>${title}</h2><span class="chevron">▾</span>
    </div>
    <div class="section-body">${bodyHtml}</div>
  </div>`;
}

/* ---------- Sección 15: propietario + botón CRM ---------- */
function buildSeccionPropietario(f){
  const faltan = camposFaltantesParaCRM(f);
  const canSend = faltan.length === 0;
  const p = f.propietario;
  const yaEnCRM = !!(f.crmEnviado && f.crmPropId);
  // Estado del envío CRM (badge OK / err)
  let crmStatus = '';
  if(yaEnCRM){
    const actualizadoTxt = f.crmActualizadoAt ? ` <span style="opacity:0.75;">· Actualizado ${_fechaCortaCRM(f.crmActualizadoAt)}</span>` : '';
    crmStatus = `<div class="crm-badge ok" id="crmStatusBadge">✓ En CRM — <strong>${escHtml(f.crmPropId)}</strong>${actualizadoTxt}
      <span class="crm-hint">Podés actualizar cuando cambies precio, dormitorios, barrio o cualquier campo — se refleja en la MISMA fila del CRM (no crea duplicado).</span></div>`;
  } else if(f.crmError){
    crmStatus = `<div class="crm-badge err" id="crmStatusBadge">✗ Error: ${escHtml(f.crmError)}</div>`;
  }
  // Faltantes visibles (SIEMPRE renderizado, con display:none si no hay faltantes,
  // para que actualizarBotonCRMEstado pueda updatearlo en vivo sin recrear el DOM)
  const faltantesTexto = canSend
    ? ''
    : `<strong>No se puede enviar todavía.</strong> Faltan: ${faltan.map(escHtml).join(', ')}.`;
  const faltantesStyle = canSend ? 'display:none;' : '';
  return `
    <div class="privacy-note">
      🔒 <strong>Estos datos NO salen en la ficha pública.</strong> Se usan sólo para cargar la propiedad en el CRM y vincularla al dueño.
    </div>

    <div class="field">
      <label>Propietario ${tip('Elegí uno existente para reusar el teléfono y mail sin retipearlos. Si el dueño es nuevo, dale a "+ Nuevo propietario".')}</label>
      <div class="propietario-picker">
        <select id="propietarioSelect">
          <option value="__loading__">Cargando propietarios…</option>
        </select>
        <button type="button" id="btnNuevoPropietario" class="btn-add-inline">+ Nuevo</button>
        <button type="button" id="btnRefrescarPropietarios" class="btn-add-inline" title="Refrescar la lista desde el CRM">↻</button>
      </div>
    </div>

    <div class="field">
      <label for="fPropNombre">Nombre del propietario *</label>
      <input type="text" id="fPropNombre" value="${escAttr(p.nombre)}" placeholder="Ej: Juan Pérez">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="fPropTel">Teléfono</label>
        <input type="text" id="fPropTel" value="${escAttr(p.tel)}" placeholder="099 123 456" inputmode="tel">
      </div>
      <div class="field">
        <label for="fPropEmail">Email</label>
        <input type="email" id="fPropEmail" value="${escAttr(p.email)}" placeholder="juan@ejemplo.com">
      </div>
    </div>

    <div class="crm-warn" id="crmFaltantesCartel" style="${faltantesStyle}">${faltantesTexto}</div>

    <div class="crm-actions">
      <button type="button" id="btnEnviarCRM" class="btn-crm" ${canSend?'':'disabled'}>
        ${yaEnCRM ? 'Actualizar en CRM' : 'Enviar al CRM'}
      </button>
      <span id="crmSpinner" class="crm-spinner hidden">${yaEnCRM ? 'Actualizando…' : 'Enviando…'}</span>
    </div>

    ${crmStatus}
  `;
}

/**
 * Devuelve "dd/mm HH:MM" a partir de un timestamp Date.now().
 * Usado en el badge "Actualizado ..." de sección 15.
 */
function _fechaCortaCRM(ts){
  try{
    const d = new Date(ts);
    const pad = n => String(n).padStart(2,'0');
    return `${pad(d.getDate())}/${pad(d.getMonth()+1)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }catch(e){ return ''; }
}

/* ---------- Sección 16: publicar en Netlify ---------- */
function buildSeccionPublicar(f){
  const motivos = motivosNoPublicarNetlify(f);
  const canPublish = motivos.length === 0;
  const subdominio = f.netlifySubdominio || netlifySubdominioSugerido(f);
  // Motivos SIEMPRE en el DOM (con display:none si vacío) para poder actualizar en vivo
  const motivosHTML = canPublish
    ? ''
    : `<strong>No se puede publicar todavía.</strong>
       <ul style="margin:6px 0 0 18px;padding:0;">
         ${motivos.map(m=>`<li>${escHtml(m)}</li>`).join('')}
       </ul>`;
  const motivosStyle = canPublish ? 'display:none;' : '';
  let netlifyStatus = '';
  if(f.netlifyPublicado && f.netlifyUrl){
    netlifyStatus = `<div class="crm-badge ok" id="netlifyStatusBadge">✓ Publicado —
      <a href="${escAttr(f.netlifyUrl)}" target="_blank" rel="noopener noreferrer">${escHtml(f.netlifyUrl)}</a>
      <button type="button" id="btnCopiarUrlNetlify" class="btn-copy-url" title="Copiar URL">📋</button>
      <span class="crm-hint">El link ya quedó guardado en el CRM automáticamente.</span>
    </div>`;
  } else if(f.netlifyError){
    netlifyStatus = `<div class="crm-badge err" id="netlifyStatusBadge">✗ Error: ${escHtml(f.netlifyError)}</div>`;
  }
  return `
    <div class="field">
      <label for="fNetlifySubdominio">Nombre del sitio en Netlify (subdominio) ${tip('El cliente va a ver esta URL: {nombre}.netlify.app. Sólo minúsculas, números y guiones. Ej: venta-cordon-ia-0042.')}</label>
      <input type="text" id="fNetlifySubdominio" value="${escAttr(subdominio)}" placeholder="venta-cordon-ia-0042"
             pattern="[a-z0-9][a-z0-9\\-]{1,61}[a-z0-9]" ${canPublish?'':'disabled'}>
      <div class="sub-hint">URL final: <code>https://<span id="netlifyUrlPreview">${escHtml(subdominio)}</span>.netlify.app</code></div>
    </div>

    <div class="crm-warn" id="netlifyMotivosCartel" style="${motivosStyle}">${motivosHTML}</div>

    <div class="crm-actions">
      <button type="button" id="btnPublicarNetlify" class="btn-crm" ${canPublish?'':'disabled'}>
        ${f.netlifyPublicado ? 'Republicar (sobrescribe)' : 'Publicar en Netlify'}
      </button>
      <span id="netlifySpinner" class="crm-spinner hidden">Publicando…</span>
    </div>

    ${netlifyStatus}
  `;
}

function escHtml(s){ return (s==null?'':String(s)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function escAttr(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ======================= LIST RENDER ======================= */
function renderList(){
  const box = document.getElementById('listaFichas');
  if(!fichas.length){
    box.innerHTML = '<div class="empty-list">Todavía no hay fichas guardadas.<br>Tocá "+ Nueva ficha" para empezar.</div>';
    return;
  }
  const sorted = [...fichas].sort((a,b)=>b.updatedAt-a.updatedAt);
  box.innerHTML = sorted.map(f=>{
    const active = f.id===currentId ? 'active' : '';
    const titulo = f.titulo || '(Sin título)';
    const sub = [f.codigo?`Cód. ${f.codigo}`:'', f.barrio||''].filter(Boolean).join(' · ') || 'Sin datos';
    return `<div class="ficha-item ${active}" data-select-ficha="${f.id}">
      <div class="fi-title">${escHtml(titulo)}</div>
      <div class="fi-sub">${escHtml(sub)}</div>
      <button type="button" class="fi-del" data-delete-ficha="${f.id}" title="Eliminar ficha">🗑</button>
    </div>`;
  }).join('');
}

/* ======================= FORM MOUNT & EVENTS ======================= */
function renderForm(){
  const container = document.querySelector('.col-form');
  const f = getCurrent();
  if(!f){
    container.innerHTML = '<div class="empty-list" style="margin-top:40px;">Elegí una ficha de la lista o creá una nueva para empezar a editar.</div>';
    return;
  }
  container.innerHTML = buildFormHTML(f);
  bindFormEvents(f);
}

function bindFormEvents(f){
  const container = document.querySelector('.col-form');

  // Section collapse toggle
  container.querySelectorAll('[data-toggle-section]').forEach(head=>{
    head.addEventListener('click', ()=>{
      const key = head.getAttribute('data-toggle-section');
      const section = head.closest('.section');
      if(collapsedSections.has(key)){ collapsedSections.delete(key); }
      else { collapsedSections.add(key); }
      section.classList.toggle('collapsed');
    });
  });

  // Simple fields (input/select/textarea with data-field)
  container.querySelectorAll('[data-field]').forEach(el=>{
    const field = el.getAttribute('data-field');
    const evt = (el.tagName==='SELECT' || el.type==='checkbox' || el.type==='radio') ? 'change' : 'input';
    el.addEventListener(evt, ()=>{
      if(el.type==='checkbox'){
        f[field] = el.checked;
        if(field==='amenitiesEnabled') renderForm();
      } else if(el.type==='radio'){
        f[field] = el.value;
        container.querySelectorAll(`input[name="${el.name}"]`).forEach(r=>r.closest('.radio-card').classList.remove('selected'));
        el.closest('.radio-card').classList.add('selected');
        if(field==='tipoPropiedad' || field==='operacion') renderForm();
      } else {
        f[field] = el.value;
      }
      onFichaChanged();
      if(field==='barrio' || field==='ciudad' || field==='referenciaMapa'){
        // El texto cambió: la coordenada geocodificada anterior ya no es
        // confiable — volvemos al mapa con pin hasta la próxima búsqueda.
        f.mapLat = null; f.mapLng = null;
        setMapGeocodeStatus('', '');
        updateMapPreview(f);
      }
      if(field==='titulo' || field==='barrio' || field==='codigo') renderList();
      if(field==='precio' || field==='moneda') updatePrecioPreview(f);
    });
  });
  updatePrecioPreview(f);

  // Ubicación / mapa: buscar coordenadas (geocodificación) al salir del campo
  // (blur) o con el botón manual "Buscar ubicación".
  ['fBarrio','fCiudad','fReferenciaMapa'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('blur', ()=>buscarUbicacionMapa(f));
  });
  const btnBuscarUbicacion = document.getElementById('btnBuscarUbicacion');
  if(btnBuscarUbicacion) btnBuscarUbicacion.addEventListener('click', ()=>buscarUbicacionMapa(f));

  // Características dinámicas
  container.querySelectorAll('[data-carac-idx]').forEach(el=>{
    el.addEventListener('input', ()=>{
      f.caracteristicas[+el.getAttribute('data-carac-idx')] = el.value;
      onFichaChanged();
    });
  });
  container.querySelectorAll('[data-del-carac]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      f.caracteristicas.splice(+btn.getAttribute('data-del-carac'),1);
      onFichaChanged(); renderForm();
    });
  });
  const btnAddCarac = document.getElementById('btnAddCarac');
  if(btnAddCarac) btnAddCarac.addEventListener('click', ()=>{
    f.caracteristicas.push('');
    onFichaChanged(); renderForm();
    const inputs = container.querySelectorAll('[data-carac-idx]');
    if(inputs.length) inputs[inputs.length-1].focus();
  });

  // Caracteristicas detalladas (checkboxes agrupados + campos numericos)
  container.querySelectorAll('[data-detalle-group]').forEach(el=>{
    const isNumber = el.getAttribute('data-detalle-type')==='number';
    el.addEventListener(isNumber ? 'input' : 'change', ()=>{
      const g = el.getAttribute('data-detalle-group');
      const k = el.getAttribute('data-detalle-key');
      if(isNumber){
        const n = parseInt(el.value, 10);
        f.caracteristicasDetalladas[g][k] = isNaN(n) || n < 0 ? 0 : n;
      } else {
        f.caracteristicasDetalladas[g][k] = el.checked;
      }
      onFichaChanged();
    });
  });

  // Amenities checkboxes
  container.querySelectorAll('[data-amenity]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const a = cb.getAttribute('data-amenity');
      if(cb.checked){ if(!f.amenities.includes(a)) f.amenities.push(a); }
      else { f.amenities = f.amenities.filter(x=>x!==a); }
      onFichaChanged();
    });
  });
  const btnAddAmenity = document.getElementById('btnAddAmenity');
  if(btnAddAmenity) btnAddAmenity.addEventListener('click', ()=>{
    askText('Nombre del amenity a agregar:', (val)=>{
      if(!val) return;
      f.amenitiesCustom = f.amenitiesCustom || [];
      f.amenitiesCustom.push(val);
      f.amenities.push(val);
      onFichaChanged(); renderForm();
    });
  });

  // Garantías aceptadas (solo cuando operación = alquiler)
  container.querySelectorAll('[data-garantia]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const g = cb.getAttribute('data-garantia');
      if(cb.checked){ if(!f.garantias.includes(g)) f.garantias.push(g); }
      else { f.garantias = f.garantias.filter(x=>x!==g); }
      onFichaChanged();
    });
  });
  const btnAddGarantia = document.getElementById('btnAddGarantia');
  if(btnAddGarantia) btnAddGarantia.addEventListener('click', ()=>{
    askText('Nombre de la garantía a agregar:', (val)=>{
      if(!val) return;
      f.garantiasCustom = f.garantiasCustom || [];
      f.garantiasCustom.push(val);
      f.garantias.push(val);
      onFichaChanged(); renderForm();
    });
  });

  // Datos del local (solo cuando tipoPropiedad = local) — estado anidado en f.local
  container.querySelectorAll('[data-local]').forEach(el=>{
    const key = el.getAttribute('data-local');
    const evt = (el.tagName==='SELECT' || el.type==='checkbox') ? 'change' : 'input';
    el.addEventListener(evt, ()=>{
      if(el.type==='checkbox') f.local[key] = el.checked;
      else f.local[key] = el.value;
      onFichaChanged();
    });
  });

  // Datos técnicos dinámicos
  container.querySelectorAll('[data-dato-idx]').forEach(el=>{
    el.addEventListener('input', ()=>{
      const idx = +el.getAttribute('data-dato-idx');
      const part = el.getAttribute('data-dato-part');
      f.datosTecnicos[idx][part] = el.value;
      onFichaChanged();
    });
  });
  container.querySelectorAll('[data-del-dato]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      f.datosTecnicos.splice(+btn.getAttribute('data-del-dato'),1);
      onFichaChanged(); renderForm();
    });
  });
  const btnAddDato = document.getElementById('btnAddDato');
  if(btnAddDato) btnAddDato.addEventListener('click', ()=>{
    f.datosTecnicos.push({label:'', valor:''});
    onFichaChanged(); renderForm();
  });

  // Fotos: modo toggle
  container.querySelectorAll('[data-fotos-modo]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      f.fotosModo = btn.getAttribute('data-fotos-modo');
      onFichaChanged(); renderForm();
    });
  });

  // Fotos: subir desde PC (con compresion automatica)
  const fFotosFile = document.getElementById('fFotosFile');
  if(fFotosFile) fFotosFile.addEventListener('change', (e)=>{
    const files = Array.from(e.target.files||[]);
    if(!files.length) return;
    const label = container.querySelector('label[for="fFotosFile"]');
    const originalLabelHtml = label ? label.innerHTML : null;
    if(label) label.innerHTML = `Procesando ${files.length} foto${files.length===1?'':'s'}... ${tip('Comprimiendo para que la ficha no pese demasiado')}`;
    fFotosFile.disabled = true;
    Promise.all(files.map(file=>compressImageFile(file, PHOTO_MAX_DIM, PHOTO_QUALITY)))
      .then(results=>{
        results.forEach(src=>{ f.fotos.push({src, isMain: f.fotos.length===0}); });
        onFichaChanged(); renderForm();
      })
      .catch(()=>{
        fFotosFile.disabled = false;
        if(label && originalLabelHtml!==null) label.innerHTML = originalLabelHtml;
        showModal('No se pudo procesar alguna de las fotos elegidas. Probá de nuevo con esa foto, o con otra.', ()=>{}, {onlyOk:true});
      });
  });

  // Fotos: URLs
  const btnAplicarUrls = document.getElementById('btnAplicarUrls');
  if(btnAplicarUrls) btnAplicarUrls.addEventListener('click', ()=>{
    const ta = document.getElementById('fFotosUrls');
    const urls = ta.value.split('\n').map(s=>s.trim()).filter(Boolean);
    f.fotos = urls.map((u,i)=>({src:u, isMain:i===0}));
    onFichaChanged(); renderForm();
  });

  // Fotos: marcar principal / borrar
  container.querySelectorAll('[data-set-main]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = +btn.getAttribute('data-set-main');
      f.fotos.forEach((p,i)=>p.isMain = i===idx);
      onFichaChanged(); renderForm();
    });
  });
  container.querySelectorAll('[data-del-photo]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = +btn.getAttribute('data-del-photo');
      const wasMain = f.fotos[idx].isMain;
      f.fotos.splice(idx,1);
      if(wasMain && f.fotos.length) f.fotos[0].isMain = true;
      onFichaChanged(); renderForm();
    });
  });

  // Fotos: drag & drop reorder
  container.querySelectorAll('.photo-thumb').forEach(thumb=>{
    thumb.addEventListener('dragstart', ()=>{
      dragPhotoIndex = +thumb.getAttribute('data-photo-idx');
    });
    thumb.addEventListener('dragover', (e)=> e.preventDefault());
    thumb.addEventListener('drop', (e)=>{
      e.preventDefault();
      const targetIdx = +thumb.getAttribute('data-photo-idx');
      if(dragPhotoIndex===null || dragPhotoIndex===targetIdx) return;
      const moved = f.fotos.splice(dragPhotoIndex,1)[0];
      f.fotos.splice(targetIdx,0,moved);
      dragPhotoIndex = null;
      onFichaChanged(); renderForm();
    });
  });

  // Bindings para las secciones nuevas (15: propietario/CRM, 16: publicar Netlify)
  bindPropietarioYPublicar(f, container);

  updateMapPreview(f);
}

/**
 * Bindings de las secciones 15 (propietario + CRM) y 16 (publicar Netlify).
 * Se llama desde bindFormEvents cada vez que se renderiza el form.
 */
function bindPropietarioYPublicar(f, container){
  // --- Campos del propietario (inputs de texto) ---
  const inpNombre = document.getElementById('fPropNombre');
  const inpTel = document.getElementById('fPropTel');
  const inpEmail = document.getElementById('fPropEmail');
  const onPropInput = ()=>{
    f.propietario.nombre = inpNombre ? inpNombre.value : '';
    f.propietario.tel = inpTel ? inpTel.value : '';
    f.propietario.email = inpEmail ? inpEmail.value : '';
    // Si el usuario tipea, deja de ser un "seleccionado del dropdown"
    if(document.activeElement === inpNombre) f.propietario.ownerId = '';
    onFichaChanged();
    // Re-evaluar si el botón CRM cambia de disabled a habilitado
    actualizarBotonCRMEstado(f);
  };
  if(inpNombre) inpNombre.addEventListener('input', onPropInput);
  if(inpTel) inpTel.addEventListener('input', onPropInput);
  if(inpEmail) inpEmail.addEventListener('input', onPropInput);

  // --- Dropdown de propietarios existentes ---
  const sel = document.getElementById('propietarioSelect');
  if(sel){
    // Populación async
    poblarDropdownPropietarios(sel, f);
    sel.addEventListener('change', ()=>{
      const val = sel.value;
      if(val === '__nuevo__' || val === '__loading__' || val === ''){
        return;
      }
      // val = ownerId. Buscar el propietario en el cache y autofill.
      const cache = leerCachePropietarios();
      const p = cache.find(x=>x.ownerId===val || x.nombre===val);
      if(p){
        f.propietario.nombre = p.nombre || '';
        f.propietario.tel = p.tel || '';
        f.propietario.email = p.email || '';
        f.propietario.ownerId = p.ownerId || '';
        if(inpNombre) inpNombre.value = f.propietario.nombre;
        if(inpTel) inpTel.value = f.propietario.tel;
        if(inpEmail) inpEmail.value = f.propietario.email;
        onFichaChanged();
        actualizarBotonCRMEstado(f);
      }
    });
  }
  const btnNuevo = document.getElementById('btnNuevoPropietario');
  if(btnNuevo) btnNuevo.addEventListener('click', ()=>{
    if(sel) sel.value = '__nuevo__';
    f.propietario.nombre = '';
    f.propietario.tel = '';
    f.propietario.email = '';
    f.propietario.ownerId = '';
    if(inpNombre){ inpNombre.value = ''; inpNombre.focus(); }
    if(inpTel) inpTel.value = '';
    if(inpEmail) inpEmail.value = '';
    onFichaChanged();
    actualizarBotonCRMEstado(f);
  });
  const btnRefresh = document.getElementById('btnRefrescarPropietarios');
  if(btnRefresh) btnRefresh.addEventListener('click', async ()=>{
    invalidarCachePropietarios();
    if(sel){
      sel.innerHTML = '<option value="__loading__">Refrescando…</option>';
      await poblarDropdownPropietarios(sel, f);
    }
  });

  // --- Botón Enviar al CRM ---
  const btnCRM = document.getElementById('btnEnviarCRM');
  const crmSpin = document.getElementById('crmSpinner');
  if(btnCRM) btnCRM.addEventListener('click', async ()=>{
    if(btnCRM.disabled) return;
    btnCRM.disabled = true;
    if(crmSpin) crmSpin.classList.remove('hidden');
    try{
      await enviarAlCRM(f);
      renderForm();
      renderList();
    }catch(e){
      f.crmError = e.message || String(e);
      persist();
      renderForm();
    }finally{
      if(crmSpin) crmSpin.classList.add('hidden');
    }
  });

  // --- Sección 16: publicar en Netlify ---
  const inpSubdominio = document.getElementById('fNetlifySubdominio');
  const preview = document.getElementById('netlifyUrlPreview');
  if(inpSubdominio && preview){
    inpSubdominio.addEventListener('input', ()=>{
      // Limpiar en vivo a caracteres válidos (minúsculas, dígitos, guiones)
      const clean = inpSubdominio.value.toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,63);
      if(clean !== inpSubdominio.value) inpSubdominio.value = clean;
      preview.textContent = clean || '(nombre-vacío)';
    });
  }
  const btnPub = document.getElementById('btnPublicarNetlify');
  const netSpin = document.getElementById('netlifySpinner');
  if(btnPub) btnPub.addEventListener('click', async ()=>{
    if(btnPub.disabled) return;
    const subdominio = inpSubdominio ? inpSubdominio.value.trim() : netlifySubdominioSugerido(f);
    btnPub.disabled = true;
    if(netSpin) netSpin.classList.remove('hidden');
    try{
      await publicarEnNetlify(f, subdominio);
      renderForm();
      renderList();
    }catch(e){
      f.netlifyError = e.message || String(e);
      persist();
      renderForm();
    }finally{
      if(netSpin) netSpin.classList.add('hidden');
    }
  });
  const btnCopy = document.getElementById('btnCopiarUrlNetlify');
  if(btnCopy) btnCopy.addEventListener('click', async ()=>{
    if(!f.netlifyUrl) return;
    try{
      await navigator.clipboard.writeText(f.netlifyUrl);
      btnCopy.textContent = '✓';
      setTimeout(()=>{ btnCopy.textContent = '📋'; }, 1500);
    }catch(e){
      // Fallback: seleccionar el link
      showModal('No pude copiar automáticamente. La URL es: '+f.netlifyUrl, ()=>{}, {onlyOk:true});
    }
  });
}

/**
 * Actualiza en vivo (sin renderForm completo) el estado visual de las
 * secciones 15 (Enviar/Actualizar CRM) y 16 (Publicar Netlify) cuando
 * el usuario tipea/cambia campos. Toca:
 *   - Cartel rojo de faltantes CRM (sección 15)
 *   - Cartel rojo de motivos Netlify (sección 16)
 *   - Botón "Enviar/Actualizar en CRM" (disabled + label)
 *   - Botón "Publicar en Netlify" (disabled)
 *   - Subdominio sugerido (si aún no fue publicado y cambiaron los inputs
 *     que lo componen: operación, barrio, propId)
 *
 * NO llama renderForm() — se ejecuta en cada keypress y perder foco sería feo.
 * El nombre se mantiene por retro-compatibilidad con los 3 callers en
 * bindPropietarioYPublicar (línea ~1533, 1561, 1576).
 */
function actualizarBotonCRMEstado(f){
  // --- Sección 15: cartel faltantes + botón Enviar/Actualizar ---
  const faltan = camposFaltantesParaCRM(f);
  const canSendCRM = faltan.length === 0;
  const cartelCRM = document.getElementById('crmFaltantesCartel');
  if(cartelCRM){
    if(canSendCRM){
      cartelCRM.style.display = 'none';
      cartelCRM.innerHTML = '';
    } else {
      cartelCRM.style.display = '';
      cartelCRM.innerHTML = `<strong>No se puede enviar todavía.</strong> Faltan: ${faltan.map(escHtml).join(', ')}.`;
    }
  }
  const btnCRM = document.getElementById('btnEnviarCRM');
  if(btnCRM){
    btnCRM.disabled = !canSendCRM;
    // Label refleja el estado — si ya está en CRM, el botón actualiza
    const yaEnCRM = !!(f.crmEnviado && f.crmPropId);
    btnCRM.textContent = yaEnCRM ? 'Actualizar en CRM' : 'Enviar al CRM';
  }
  const spinCRM = document.getElementById('crmSpinner');
  if(spinCRM){
    const yaEnCRM = !!(f.crmEnviado && f.crmPropId);
    spinCRM.textContent = yaEnCRM ? 'Actualizando…' : 'Enviando…';
  }

  // --- Sección 16: cartel motivos + botón Publicar ---
  const motivos = motivosNoPublicarNetlify(f);
  const canPublish = motivos.length === 0;
  const cartelNetlify = document.getElementById('netlifyMotivosCartel');
  if(cartelNetlify){
    if(canPublish){
      cartelNetlify.style.display = 'none';
      cartelNetlify.innerHTML = '';
    } else {
      cartelNetlify.style.display = '';
      cartelNetlify.innerHTML = `<strong>No se puede publicar todavía.</strong>
        <ul style="margin:6px 0 0 18px;padding:0;">
          ${motivos.map(m=>`<li>${escHtml(m)}</li>`).join('')}
        </ul>`;
    }
  }
  const btnPub = document.getElementById('btnPublicarNetlify');
  if(btnPub) btnPub.disabled = !canPublish;
  const inpSubdominio = document.getElementById('fNetlifySubdominio');
  if(inpSubdominio) inpSubdominio.disabled = !canPublish;

  // --- Subdominio sugerido: si aún no fue publicado, recalcular al vuelo
  // (así el usuario ve el nombre correcto apenas se completa el propId del CRM
  // sin tener que renderizar). Solo actualiza si el input está vacío o si
  // todavía muestra el sugerido viejo — no pisa lo que el usuario tipeó a mano.
  if(inpSubdominio && !f.netlifyPublicado){
    const sugerido = netlifySubdominioSugerido(f);
    const previa = f.netlifySubdominio || '';
    // Actualizar solo si el input actual == sugerido viejo (o vacío)
    const previaSugerida = _subdominioSugeridoConId(f, previa) === previa && previa !== '';
    if(!inpSubdominio.value || previaSugerida || inpSubdominio.value === previa){
      if(document.activeElement !== inpSubdominio){  // no pisar mientras tipea
        inpSubdominio.value = sugerido;
        const prev = document.getElementById('netlifyUrlPreview');
        if(prev) prev.textContent = sugerido || '(nombre-vacío)';
      }
    }
  }
}

// Helper interno: chequea si un subdominio dado se parece al sugerido para
// una ficha (útil para decidir si podemos sobrescribirlo con uno nuevo o si
// el usuario lo editó a mano).
function _subdominioSugeridoConId(f, subdominio){
  // Simplificación: siempre devolvemos el sugerido actual. Si difiere del
  // parámetro es porque el usuario lo cambió. Se usa arriba para no pisar.
  return netlifySubdominioSugerido(f);
}

/**
 * Puebla el <select> de propietarios haciendo fetch a listarPropietarios
 * (cacheado 5 min). Deja seleccionado el propietario actual de la ficha
 * si existe.
 */
async function poblarDropdownPropietarios(sel, f){
  let lista;
  try{
    lista = await cargarPropietarios(false);
  }catch(e){
    sel.innerHTML = `<option value="">— No se pudieron cargar (${escHtml(e.message)}) —</option>
      <option value="__nuevo__">+ Cargar propietario manualmente</option>`;
    return;
  }
  const opts = ['<option value="">— Elegí un propietario —</option>'];
  opts.push('<option value="__nuevo__">+ Nuevo propietario</option>');
  lista.forEach(p=>{
    const label = [p.nombre, p.tel].filter(Boolean).join(' — ');
    const val = p.ownerId || p.nombre;
    opts.push(`<option value="${escAttr(val)}">${escHtml(label)}</option>`);
  });
  sel.innerHTML = opts.join('');
  // Si la ficha ya tiene un propietario elegido, marcarlo
  const currentVal = f.propietario.ownerId || f.propietario.nombre;
  if(currentVal){
    const match = lista.find(p => (p.ownerId||p.nombre) === currentVal);
    if(match) sel.value = match.ownerId || match.nombre;
  }
}

function leerCachePropietarios(){
  try{
    const raw = localStorage.getItem(PROPIETARIOS_CACHE_KEY);
    if(!raw) return [];
    const cached = JSON.parse(raw);
    return (cached && Array.isArray(cached.propietarios)) ? cached.propietarios : [];
  }catch(e){ return []; }
}

function updateMapPreview(f){
  const iframe = document.querySelector('.map-preview iframe');
  if(!iframe) return;
  iframe.src = mapEmbedSrc(f);
}

function updatePrecioPreview(f){
  const el = document.getElementById('precioPreview');
  if(!el) return;
  const digits = String(f.precio == null ? '' : f.precio).replace(/[^\d]/g, '');
  el.textContent = digits ? ('Se verá: ' + formatPrice(f)) : '';
}

function onFichaChanged(){
  const f = getCurrent();
  if(f) f.updatedAt = Date.now();
  markDirty();
  updatePreview();
}

/* Simple inline prompt helper (kept minimal, browser prompt is fine for a single text value) */
function askText(message, cb){
  const val = window.prompt(message, '');
  if(val && val.trim()) cb(val.trim());
}

/* ======================= FICHA HTML GENERATOR ======================= */
const OPERACION_LABEL = { venta:'Venta', alquiler:'Alquiler', renta:'Venta con renta' };

function formatPrice(f){
  // Los precios inmobiliarios son números enteros. Se ignoran puntos/comas/
  // espacios que el usuario haya escrito como separadores de miles (ej:
  // "39.990" o "39,990" o "39 990" → 39990) y se re-formatea con el punto de
  // miles uruguayo automáticamente ("$ 39.990"). Robusto ante la costumbre de
  // escribir el precio con el punto de miles.
  const digits = String(f.precio == null ? '' : f.precio).replace(/[^\d]/g, '');
  const n = digits ? Number(digits) : 0;
  const formatted = n.toLocaleString('es-UY');
  if(f.moneda==='UYU') return `$ ${formatted}`;
  if(f.moneda==='USD_ANV') return `US$ ${formatted} + saldo ANV`;
  return `US$ ${formatted}`;
}

// La ficha se descarga SIEMPRE como "index.html" para subir directo a Netlify
// sin renombrar (index.html es la "portada" que Netlify muestra en la raíz del
// link). El nombre de la propiedad no se pierde: va en el nombre del proyecto
// de Netlify (el subdominio del link), no en el archivo.
function fichaFileName(f){
  return 'index.html';
}

// Limpieza SEGURA de texto (solo aplica a la ficha final, NO altera lo que el
// usuario escribió en el formulario). No toca palabras ni tildes: solo colapsa
// espacios repetidos, saca el espacio antes de signos de puntuación y pone
// mayúscula inicial. Sin riesgo de cambiar el sentido.
function limpiarTextoSeguro(s){
  let t = String(s == null ? '' : s)
    .replace(/[ \t]+/g, ' ')            // espacios múltiples -> uno
    .replace(/ +([,.;:!?])/g, '$1')     // sacar espacio antes de , . ; : ! ?
    .replace(/\s+$/,'').replace(/^\s+/,''); // trim
  if(t) t = t.charAt(0).toUpperCase() + t.slice(1);
  return t;
}

// Cada línea no vacía se muestra como un párrafo prolijo (mejor disposición),
// con espaciado parejo. El texto queda limpio pero sin cambiar palabras.
function descripcionParrafos(desc){
  return (desc||'').split('\n')
    .map(l=>limpiarTextoSeguro(l))
    .filter(Boolean)
    .map(p=>`<p>${escHtml(p)}</p>`).join('\n      ');
}

/* Video: se pega un LINK (YouTube / Vimeo / Instagram), nunca el archivo —
   así la ficha se mantiene liviana. Detecta la plataforma y arma el embed
   correspondiente; si no reconoce el link, muestra un botón "Ver video". */
function extractYouTubeId(url){
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{6,})/i);
  return m ? m[1] : null;
}
function extractVimeoId(url){
  const m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/i);
  return m ? m[1] : null;
}
function extractInstagramPermalink(url){
  const m = url.match(/instagram\.com\/(reel|reels|p|tv)\/([A-Za-z0-9_-]+)/i);
  if(!m) return null;
  const kind = m[1]==='reels' ? 'reel' : m[1];
  return `https://www.instagram.com/${kind}/${m[2]}/`;
}

function buildVideoBlock(f){
  const url = (f.videoUrl || '').trim();
  if(!url) return '';
  const yt = extractYouTubeId(url);
  if(yt){
    return `
    <h2>Video</h2>
    <div class="video-wrap">
      <iframe src="https://www.youtube.com/embed/${yt}" loading="lazy" title="Video de la propiedad" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>`;
  }
  const vim = extractVimeoId(url);
  if(vim){
    return `
    <h2>Video</h2>
    <div class="video-wrap">
      <iframe src="https://player.vimeo.com/video/${vim}" loading="lazy" title="Video de la propiedad" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    </div>`;
  }
  const ig = extractInstagramPermalink(url);
  if(ig){
    return `
    <h2>Video</h2>
    <div class="video-wrap video-instagram">
      <blockquote class="instagram-media" data-instgrm-permalink="${escAttr(ig)}" data-instgrm-version="14" style="margin:0;width:100%;"></blockquote>
    </div>
    <script async src="https://www.instagram.com/embed.js"><\/script>`;
  }
  return `
    <h2>Video</h2>
    <a class="btn btn-tel" href="${escAttr(url)}" target="_blank" rel="noopener">Ver video</a>`;
}

  // Galería de fotos visible (thumbnails). Solo si hay más de 1 foto — con 1
