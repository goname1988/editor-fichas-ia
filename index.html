// CRC-32 (para armar el ZIP). Tabla generada una vez.
function _crc32(buf){
  if(!_crc32._t){
    const t = new Uint32Array(256);
    for(let n=0;n<256;n++){
      let c = n;
      for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    _crc32._t = t;
  }
  const t = _crc32._t;
  let crc = 0xFFFFFFFF;
  for(let i=0;i<buf.length;i++) crc = (t[(crc ^ buf[i]) & 0xFF] ^ (crc >>> 8)) >>> 0;
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

// Arma un ZIP (formato "stored", sin compresión) con UN solo archivo adentro.
// Sin librerías externas. Suficiente para empaquetar index.html y subir a
// Netlify (Netlify extrae el zip solo y sirve index.html en la raíz).
function buildZipSingleFile(nombreInterno, contentBytes){
  const enc = new TextEncoder();
  const nameBytes = enc.encode(nombreInterno);
  const crc = _crc32(contentBytes);
  const size = contentBytes.length;
  const nameLen = nameBytes.length;
  const total = (30 + nameLen) + size + (46 + nameLen) + 22;
  const out = new Uint8Array(total);
  const dv = new DataView(out.buffer);
  let o = 0;
  // --- Local file header ---
  dv.setUint32(o, 0x04034b50, true); o+=4;
  dv.setUint16(o, 20, true); o+=2;   // version needed
  dv.setUint16(o, 0, true);  o+=2;   // flags
  dv.setUint16(o, 0, true);  o+=2;   // method 0 = stored
  dv.setUint16(o, 0, true);  o+=2;   // mod time
  dv.setUint16(o, 0x21, true); o+=2; // mod date (1980-01-01)
  dv.setUint32(o, crc, true); o+=4;
  dv.setUint32(o, size, true); o+=4; // comp size
  dv.setUint32(o, size, true); o+=4; // uncomp size
  dv.setUint16(o, nameLen, true); o+=2;
  dv.setUint16(o, 0, true); o+=2;    // extra len
  out.set(nameBytes, o); o+=nameLen;
  out.set(contentBytes, o); o+=size;
  const centralStart = o;
  // --- Central directory header ---
  dv.setUint32(o, 0x02014b50, true); o+=4;
  dv.setUint16(o, 20, true); o+=2;   // version made by
  dv.setUint16(o, 20, true); o+=2;   // version needed
  dv.setUint16(o, 0, true);  o+=2;   // flags
  dv.setUint16(o, 0, true);  o+=2;   // method
  dv.setUint16(o, 0, true);  o+=2;   // mod time
  dv.setUint16(o, 0x21, true); o+=2; // mod date
  dv.setUint32(o, crc, true); o+=4;
  dv.setUint32(o, size, true); o+=4;
  dv.setUint32(o, size, true); o+=4;
  dv.setUint16(o, nameLen, true); o+=2;
  dv.setUint16(o, 0, true); o+=2;    // extra
  dv.setUint16(o, 0, true); o+=2;    // comment
  dv.setUint16(o, 0, true); o+=2;    // disk number
  dv.setUint16(o, 0, true); o+=2;    // internal attrs
  dv.setUint32(o, 0, true); o+=4;    // external attrs
  dv.setUint32(o, 0, true); o+=4;    // offset of local header
  out.set(nameBytes, o); o+=nameLen;
  const centralSize = o - centralStart;
  // --- End of central directory ---
  dv.setUint32(o, 0x06054b50, true); o+=4;
  dv.setUint16(o, 0, true); o+=2;    // disk
  dv.setUint16(o, 0, true); o+=2;    // disk with cd
  dv.setUint16(o, 1, true); o+=2;    // entries this disk
  dv.setUint16(o, 1, true); o+=2;    // total entries
  dv.setUint32(o, centralSize, true); o+=4;
  dv.setUint32(o, centralStart, true); o+=4;
  dv.setUint16(o, 0, true); o+=2;    // comment len
  return out;
}

// Nombre descriptivo del ZIP que se descarga (el archivo adentro siempre es
// index.html). Ej: "alquiler-la-blanqueada-ia-0001.zip".
function zipFileName(f){
  const opLabels = { venta:'venta', alquiler:'alquiler', renta:'venta-renta' };
  const op = slugify(opLabels[f.operacion] || 'ficha');
  const barrio = slugify(f.barrio) || 'propiedad';
  const cod = slugify(f.codigo);
  return [op, barrio, cod].filter(Boolean).join('-') + '.zip';
}

function descargarFichaHTML(){
  const f = getCurrent();
  if(!f){ showModal('Elegí o creá una ficha antes de descargar.', ()=>{}, {onlyOk:true}); return; }
  const html = generarFichaHTML(f);
  const bytes = new TextEncoder().encode(html);
  const zip = buildZipSingleFile('index.html', bytes);
  const blob = new Blob([zip], {type:'application/zip'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = zipFileName(f);
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* ======================= CRM + NETLIFY INTEGRATION =======================
   Hooks para enviar la propiedad al CRM (Google Sheet via Apps Script web
   app) y para publicarla online en Netlify (Netlify Function con token
   guardado server-side). Ver plan en .claude/plans/contexto-proyecto-*.md
=========================================================================== */

/**
 * Helper: POST al web app del Apps Script.
 * Content-Type text/plain evita el preflight CORS de Apps Script.
 * Retorna la respuesta ya parseada como JSON o lanza Error con mensaje útil.
 */
async function crmFetch(action, data){
  const body = JSON.stringify({ token: API_TOKEN, action, data: data||{} });
  let res;
  try{
    res = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body,
      redirect: 'follow'
    });
  }catch(e){
    throw new Error('Sin conexión con el CRM. Verificá internet o reintentá en unos segundos.');
  }
  const text = await res.text();
  let json;
  try{ json = JSON.parse(text); }
  catch(e){ throw new Error('Respuesta inesperada del CRM: '+ text.slice(0,200)); }
  if(!res.ok || json.ok===false){
    throw new Error(json.error || ('Error del CRM (status '+res.status+')'));
  }
  return json;
}

/**
 * Devuelve la lista de propietarios (cache 5 min en localStorage).
 * Cada propietario: { nombre, tel, email, ownerId }
 * forceRefresh=true ignora el cache (ej: después de crear uno nuevo).
 */
async function cargarPropietarios(forceRefresh){
  const now = Date.now();
  if(!forceRefresh){
    try{
      const raw = localStorage.getItem(PROPIETARIOS_CACHE_KEY);
      if(raw){
        const cached = JSON.parse(raw);
        if(cached && cached.ts && (now - cached.ts) < PROPIETARIOS_CACHE_TTL_MS){
          return cached.propietarios || [];
        }
      }
    }catch(e){}
  }
  const resp = await crmFetch('listarPropietarios');
  const lista = Array.isArray(resp.propietarios) ? resp.propietarios : [];
  try{
    localStorage.setItem(PROPIETARIOS_CACHE_KEY, JSON.stringify({ ts:now, propietarios:lista }));
  }catch(e){}
  return lista;
}

function invalidarCachePropietarios(){
  try{ localStorage.removeItem(PROPIETARIOS_CACHE_KEY); }catch(e){}
}

/**
 * Devuelve los campos que faltan para poder enviar al CRM.
 * Si el array está vacío, se puede enviar.
 */
function camposFaltantesParaCRM(f){
  const faltan = [];
  if(!f.titulo || !String(f.titulo).trim()) faltan.push('Título');
  if(!f.precio || !String(f.precio).trim()) faltan.push('Precio');
  if(!f.barrio || !String(f.barrio).trim()) faltan.push('Barrio');
  if(!f.operacion) faltan.push('Operación');
  if(!f.tipoPropiedad) faltan.push('Tipo de propiedad');
  if(!f.propietario || !f.propietario.nombre || !String(f.propietario.nombre).trim()){
    faltan.push('Propietario (nombre)');
  }
  return faltan;
}

/**
 * Devuelve los motivos por los que NO se puede publicar en Netlify.
 * Array vacío = se puede publicar.
 */
function motivosNoPublicarNetlify(f){
  const motivos = [];
  if(!f.crmEnviado || !f.crmPropId){
    motivos.push('Primero enviá al CRM (el subdominio se arma con el ID del CRM para evitar duplicados)');
  }
  if(!f.titulo || !String(f.titulo).trim()) motivos.push('Falta título');
  if(!f.fotos || !f.fotos.length) motivos.push('Falta al menos 1 foto');
  return motivos;
}

/**
 * Mapea el state de la ficha al formato que espera apiCrearPropiedad(d) del
 * Apps Script. Ver Código.js línea 5044.
 */
function fichaToCrmPayload(f){
  const tipo = (f.operacion === 'alquiler') ? 'Alquiler' : 'Venta';
  const cap = s => s ? (s.charAt(0).toUpperCase() + s.slice(1)) : '';
  const tipoInmueble = cap(f.tipoPropiedad);  // 'Apartamento' | 'Casa' | 'Local'
  const precioNum = String(f.precio||'').replace(/[^\d]/g,'');
  const precioUYU = (f.moneda === 'UYU') ? precioNum : '';
  const precioUSD = (f.moneda === 'USD' || f.moneda === 'USD + saldo ANV') ? precioNum : '';
  const garantiasStr = (Array.isArray(f.garantias) && f.garantias.length)
    ? f.garantias.join(', ') : '';
  return {
    tipo,
    tipoInmueble,
    barrio: (f.barrio||'').trim(),
    direccion: '',                 // el editor no captura dirección exacta (privacy)
    dorm: f.dormitorios || '',
    m2: f.metraje || '',
    propietario: (f.propietario.nombre||'').trim(),
    telPropietario: (f.propietario.tel||'').trim(),
    emailPropietario: (f.propietario.email||'').trim(),
    precioUYU,
    precioUSD,
    garantias: garantiasStr,
    formasPago: '',
    banco: '',
    link: f.netlifyUrl || ''       // si aún no se publicó en Netlify, va vacío
  };
}

/**
 * Envía la propiedad al CRM.
 *  - Si f.crmEnviado + f.crmPropId → llama actualizarPropiedad (misma fila)
 *  - Si no → llama crearPropiedad (fila nueva)
 * Si el CRM responde error "no se encontró" al actualizar (ej: la fila fue
 * borrada manualmente), muestra modal preguntando si crear una nueva.
 * Actualiza state + persist en cada caso.
 */
async function enviarAlCRM(f){
  const faltan = camposFaltantesParaCRM(f);
  if(faltan.length){
    throw new Error('Faltan: ' + faltan.join(', '));
  }
  const esUpdate = !!(f.crmEnviado && f.crmPropId);
  const payload = fichaToCrmPayload(f);
  if(esUpdate) payload.propId = f.crmPropId;

  let resp;
  try{
    resp = await crmFetch(esUpdate ? 'actualizarPropiedad' : 'crearPropiedad', payload);
  }catch(e){
    // Si es update y el error indica "no se encontró", preguntar si crear nueva
    const msg = String(e.message || e).toLowerCase();
    if(esUpdate && /no se encontr/i.test(msg)){
      return _preguntarCrearNueva(f);
    }
    throw e;
  }

  if(esUpdate){
    // Update exitoso — la Prop_ID no cambia, solo timestamp
    f.crmActualizadoAt = Date.now();
    f.crmError = '';
    f.updatedAt = Date.now();
    persist();
    return resp;
  }

  // Create exitoso
  if(!resp.propId){
    throw new Error('El CRM no devolvió Prop_ID. Respuesta: '+ JSON.stringify(resp).slice(0,200));
  }
  f.crmEnviado = true;
  f.crmPropId = resp.propId;
  f.crmEnviadoAt = Date.now();
  f.crmActualizadoAt = 0;
  f.crmError = '';
  // Invalidar cache de propietarios por si acabamos de crear uno nuevo
  invalidarCachePropietarios();
  f.updatedAt = Date.now();
  persist();
  return resp;
}

/**
 * Modal: "No se encontró IA-XXXX. ¿Crear una propiedad nueva?"
 * Si Sí → resetea crmPropId + crmEnviado y re-llama enviarAlCRM (que ahora hace create).
 * Si No → lanza error para que el caller lo muestre.
 */
function _preguntarCrearNueva(f){
  return new Promise((resolve, reject)=>{
    const propIdViejo = f.crmPropId || '(desconocido)';
    showModal(
      `No se encontró ${propIdViejo} en el CRM (¿alguien la borró?). ¿Querés crear una propiedad NUEVA con estos datos? (Se generará otro Prop_ID)`,
      async ()=>{
        // Sí → resetear estado CRM y re-intentar como create
        f.crmEnviado = false;
        f.crmPropId = '';
        f.crmActualizadoAt = 0;
        f.crmError = '';
        try{
          const resp = await enviarAlCRM(f);
          resolve(resp);
        }catch(e){ reject(e); }
      },
      {} // onlyOk=false → aparece Cancelar
    );
    // Nota: si el usuario aprieta Cancelar, showModal cierra sin llamar onOk.
    // Dejamos la promesa colgando; el finally del caller resetea el spinner.
    // Para no dejar el botón deshabilitado eternamente, resolvemos "vacío"
    // después de 100ms si no se resolvió aún — el patrón de showModal no
    // expone onCancel, así que asumimos: si no se resolvió en el modal, el
    // usuario canceló y arrojamos un error informativo.
    setTimeout(()=>{
      reject(new Error('Cancelado por el usuario. La propiedad NO fue creada. Rearmá el propId manualmente si querés reenviar.'));
    }, 60000);  // timeout largo para que el usuario tenga tiempo de decidir
  });
}

/**
 * Construye el subdominio sugerido para Netlify. Usa el propId del CRM (único
 * server-side) NO el código local del editor (que puede chocar entre PCs).
 */
function netlifySubdominioSugerido(f){
  const opLabels = { venta:'venta', alquiler:'alquiler', renta:'venta-renta' };
  const op = slugify(opLabels[f.operacion] || 'ficha');
  const barrio = slugify(f.barrio) || 'propiedad';
  const id = slugify(f.crmPropId || f.codigo || '');
  return [op, barrio, id].filter(Boolean).join('-').toLowerCase();
}

/**
 * Encode Uint8Array → base64 en chunks (evita "Maximum call stack" con arrays grandes).
 */
function bytesToBase64(bytes){
  const CHUNK = 0x8000;
  let bin = '';
  for(let i=0; i<bytes.length; i+=CHUNK){
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i+CHUNK));
  }
  return btoa(bin);
}

/**
 * Publica la ficha en Netlify usando el protocolo file digests. Extrae cada
 * foto base64 embebida como archivo aparte y las sube UNA por UNA a la
 * Netlify Function — cada request queda <1MB, nunca excede el límite de 6MB
 * que tienen las Functions synchronous.
 *
 * Pasos:
 *   1) Generar HTML + extraer fotos base64 → /fotos/foto-N.jpg externas
 *   2) SHA1 hex de cada archivo (index.html + fotos)
 *   3) INIT: manifest → Function → deployId + lista de sha1 requeridos
 *   4) UPLOAD: cada archivo required por separado (loop)
 *   5) CHECK: polea estado hasta "ready" (max 60s)
 *   6) Update f.netlifyUrl + persist + actualizar link en CRM
 */
async function publicarEnNetlify(f, subdominio){
  const motivos = motivosNoPublicarNetlify(f);
  if(motivos.length){
    throw new Error('No se puede publicar. ' + motivos.join('. ') + '.');
  }
  const name = String(subdominio||'').trim().toLowerCase();
  if(!/^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$/.test(name)){
    throw new Error('Nombre inválido. Solo minúsculas, números y guiones, entre 3 y 63 caracteres.');
  }

  // 1. Generar HTML de la ficha + extraer fotos base64 como archivos separados
  const htmlOriginal = generarFichaHTML(f);
  const { html, fotos } = _extraerFotosBase64ParaDeploy(htmlOriginal);
  const htmlBytes = new TextEncoder().encode(html);

  const archivos = [{ path: 'index.html', bytes: htmlBytes }].concat(fotos);

  // 2. Calcular SHA1 hex de cada archivo → manifest para Netlify
  const manifest = {};
  for(const a of archivos){
    manifest['/' + a.path] = await _sha1Hex(a.bytes);
  }

  // 3. INIT — pedir a la Function que cree/reuse el site e inicie deploy
  let initResp;
  try{
    initResp = await _netlifyFn({ action: 'init', name, files: manifest });
  }catch(e){
    throw new Error('No se pudo iniciar el deploy: ' + e.message);
  }
  const { deployId, siteUrl, required } = initResp;

  // 4. UPLOAD — subir cada archivo requerido por separado
  const shaToArchivo = {};
  for(const a of archivos){
    shaToArchivo[manifest['/' + a.path]] = a;
  }
  const requiredList = Array.isArray(required) ? required : [];
  for(let i = 0; i < requiredList.length; i++){
    const sha = requiredList[i];
    const arch = shaToArchivo[sha];
    if(!arch){
      throw new Error('Netlify pidió un SHA que no está en el manifest: ' + sha);
    }
    const uploadUrl = NETLIFY_DEPLOY_FN
      + '?action=upload&deployId=' + encodeURIComponent(deployId)
      + '&path=' + encodeURIComponent('/' + arch.path);
    let up;
    try{
      up = await fetch(uploadUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/octet-stream' },
        body: arch.bytes
      });
    }catch(e){
      throw new Error('Sin conexión al subir ' + arch.path + '. Reintentá.');
    }
    if(!up.ok){
      let msg = 'status ' + up.status;
      try{ const j = await up.json(); if(j.error) msg = j.error; }catch(e){}
      throw new Error('Falló subir ' + arch.path + ': ' + msg);
    }
  }

  // 5. CHECK — polear estado del deploy hasta "ready" (max 60 chequeos × 1s = 60s)
  let state = initResp.state || '';
  let checkUrl = siteUrl;
  for(let attempt = 0; attempt < 60 && state !== 'ready' && state !== 'error'; attempt++){
    await new Promise(r => setTimeout(r, 1000));
    let check;
    try{
      check = await _netlifyFn({ action: 'check', deployId });
    }catch(e){
      // Errores transitorios de red no matan el deploy — sigue polling
      continue;
    }
    state = check.state;
    if(check.url) checkUrl = check.url;
    if(state === 'error'){
      throw new Error('Deploy falló en Netlify: ' + (check.errorMessage || 'sin detalle'));
    }
  }
  // Aunque no se llegue a "ready", si todos los uploads salieron OK el deploy
  // termina solo en segundos más — no bloqueamos al usuario indefinidamente.

  // 6. Actualizar state local
  f.netlifyPublicado = true;
  f.netlifyUrl = siteUrl;
  f.netlifySubdominio = name;
  f.netlifyPublicadoAt = Date.now();
  f.netlifyError = '';
  f.updatedAt = Date.now();
  persist();

  // 7. Actualizar link en CRM (best-effort — si falla no bloquea)
  if(f.crmPropId){
    try{
      await crmFetch('actualizarLinkPropiedad', { propId: f.crmPropId, link: siteUrl });
    }catch(e){
      f.crmError = 'Se publicó en Netlify pero no se pudo actualizar el link en el CRM: '+ e.message;
      persist();
    }
  }
  return { url: siteUrl, deployId, state, subidos: requiredList.length };
}

/**
 * Helper: POST JSON a la Netlify Function (init o check). Parsea respuesta
 * o lanza Error con mensaje útil.
 */
async function _netlifyFn(payload){
  let res;
  try{
    res = await fetch(NETLIFY_DEPLOY_FN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  }catch(e){
    throw new Error('Sin conexión con la Netlify Function. Verificá internet.');
  }
  const text = await res.text();
  let json;
  try{ json = JSON.parse(text); }
  catch(e){ throw new Error('Respuesta inesperada de Netlify: '+ text.slice(0,200)); }
  if(!res.ok){
    throw new Error(json.error || ('Error de Netlify (status '+res.status+')'));
  }
  return json;
}

/**
 * Recorre el HTML de la ficha y extrae cada `data:image/...` base64 embebido
 * como archivo separado. Reemplaza cada uno por `./fotos/foto-N.ext` en el
 * HTML. Deja las URLs externas (http/https) intactas — no las descarga.
 *
 * Devuelve: { html: string, fotos: [{path, bytes}] }
 *
 * El path siempre queda como `fotos/foto-N.ext` (sin barra inicial). Cuando
 * se arma el manifest se le antepone "/" para Netlify.
 */
function _extraerFotosBase64ParaDeploy(html){
  const fotos = [];
  let idx = 0;
  const re = /data:(image\/[a-z0-9+.\-]+);base64,([A-Za-z0-9+/=]+)/gi;
  const nuevoHtml = html.replace(re, (_match, mime, b64) => {
    const extRaw = mime.split('/')[1] || 'jpg';
    const ext = extRaw.replace('+xml','').replace('svg','svg').replace('jpeg','jpg');
    let bin;
    try{ bin = atob(b64); }
    catch(e){ return _match; }  // si el base64 está corrupto, dejarlo como estaba
    const bytes = new Uint8Array(bin.length);
    for(let i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const path = 'fotos/foto-' + idx + '.' + ext;
    fotos.push({ path, bytes });
    idx++;
    return './' + path;
  });
  return { html: nuevoHtml, fotos };
}

/**
 * SHA-1 hex string de un Uint8Array. Usa Web Crypto (nativo en todos los
 * navegadores modernos, incluye Chrome desde 2013). Netlify espera sha1 hex
 * de 40 caracteres.
 */
async function _sha1Hex(bytes){
  const hash = await crypto.subtle.digest('SHA-1', bytes);
  const arr = new Uint8Array(hash);
  let hex = '';
  for(let i=0; i<arr.length; i++){
    hex += arr[i].toString(16).padStart(2, '0');
  }
  return hex;
}

/* ======================= BACKUP EXPORT / IMPORT ======================= */
function descargarBackupArchivo(nombre){
  const blob = new Blob([JSON.stringify(fichas, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nombre;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function exportarBackup(){
  const stamp = new Date().toISOString().slice(0,10);
  descargarBackupArchivo(`ia-propiedades-fichas-backup-${stamp}.json`);
}

// Respaldo automático: baja una copia una vez por día (la primera vez que se
// guarda algo ese día), sin que el usuario tenga que apretar nada. Idempotente
// por día vía la fecha guardada en localStorage.
const AUTOBACKUP_KEY = 'ia_fichas_last_autobackup';
function maybeAutoBackup(){
  try{
    if(!fichas.length) return;
    const today = new Date().toISOString().slice(0,10);
    if(localStorage.getItem(AUTOBACKUP_KEY) === today) return;
    localStorage.setItem(AUTOBACKUP_KEY, today); // marcar antes, evita descargas repetidas
    descargarBackupArchivo(`respaldo-fichas-${today}.json`);
  }catch(e){}
}

function importarBackup(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let parsed;
    try{ parsed = JSON.parse(reader.result); }
    catch(e){ showModal('El archivo elegido no es un backup válido (JSON inválido).', ()=>{}, {onlyOk:true}); return; }
    if(!Array.isArray(parsed)){ showModal('El archivo elegido no tiene el formato esperado.', ()=>{}, {onlyOk:true}); return; }
    showModal(`Esto va a REEMPLAZAR las ${fichas.length} fichas actuales por las ${parsed.length} del backup. ¿Continuar?`, ()=>{
      fichas = parsed;
      fichas.forEach(ensureCaracteristicasDetalladas);
      fichas.forEach(f=>{ if(!f.codigo || !String(f.codigo).trim()) f.codigo = nextCodigo(); });
      currentId = fichas.length ? fichas[0].id : null;
      persist();
      renderList();
      renderForm();
      updatePreview();
    });
  };
  reader.readAsText(file);
}

/* ======================= AUTOSAVE ======================= */
setInterval(()=>{
  if(dirty){
    dirty = false;
    persist();
  }
}, 5000);

window.addEventListener('beforeunload', (e)=>{
  if(dirty){
    e.preventDefault();
    e.returnValue = '';
  }
});

/* ======================= MODAL (confirm) ======================= */
let modalOkCallback = null;
function showModal(text, onOk, opts){
  opts = opts || {};
  document.getElementById('modalText').textContent = text;
  document.getElementById('modalOk').textContent = opts.onlyOk ? 'Entendido' : 'Confirmar';
  document.getElementById('modalCancel').style.display = opts.onlyOk ? 'none' : '';
  modalOkCallback = onOk;
  document.getElementById('modalBackdrop').classList.add('active');
}
function hideModal(){
  document.getElementById('modalBackdrop').classList.remove('active');
  modalOkCallback = null;
}
document.getElementById('modalOk').addEventListener('click', ()=>{
  const cb = modalOkCallback;
  hideModal();
  if(cb) cb();
});
document.getElementById('modalCancel').addEventListener('click', hideModal);
document.getElementById('modalBackdrop').addEventListener('click', (e)=>{
  if(e.target.id==='modalBackdrop') hideModal();
});

/* ======================= FICHA CRUD (list interactions) ======================= */
function seleccionarFicha(id){
  if(dirty){ persist(); dirty = false; }
  currentId = id;
  localStorage.setItem(LAST_ID_KEY, id);
  collapsedSections.clear();
  renderList();
  renderForm();
  updatePreview();
  goToTab('form');
}

function crearFicha(){
  const f = nuevaFicha();
  fichas.push(f);
  currentId = f.id;
  persist();
  collapsedSections.clear();
  renderList();
  renderForm();
  updatePreview();
  goToTab('form');
}

function eliminarFicha(id){
  const f = fichas.find(x=>x.id===id);
  const nombre = f ? (f.titulo || 'esta ficha') : 'esta ficha';
  showModal(`¿Eliminar "${nombre}"? Esta acción no se puede deshacer.`, ()=>{
    fichas = fichas.filter(x=>x.id!==id);
    if(currentId===id){ currentId = fichas.length ? fichas[0].id : null; }
    persist();
    renderList();
    renderForm();
    updatePreview();
  });
}

document.getElementById('listaFichas').addEventListener('click', (e)=>{
  const delBtn = e.target.closest('[data-delete-ficha]');
  if(delBtn){ eliminarFicha(delBtn.getAttribute('data-delete-ficha')); return; }
  const item = e.target.closest('[data-select-ficha]');
  if(item){ seleccionarFicha(item.getAttribute('data-select-ficha')); }
});

document.getElementById('btnNueva').addEventListener('click', crearFicha);

/* ======================= HEADER ACTIONS ======================= */
document.getElementById('btnGuardar').addEventListener('click', ()=>{
  dirty = false;
  persist();
});
document.getElementById('btnDescargar').addEventListener('click', descargarFichaHTML);
document.getElementById('btnExportar').addEventListener('click', exportarBackup);
document.getElementById('btnImportar').addEventListener('click', ()=>{
  document.getElementById('inputImportar').click();
});
document.getElementById('inputImportar').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(file) importarBackup(file);
  e.target.value = '';
});

/* ======================= MOBILE TABS ======================= */
function goToTab(name){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.getAttribute('data-tab')===name));
  document.querySelectorAll('.col').forEach(c=>c.classList.toggle('active-tab', c.getAttribute('data-col')===name));
}
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>goToTab(btn.getAttribute('data-tab')));
});

/* ======================= INIT ======================= */
async function init(){
  try{ await loadFichas(); }
  catch(e){ fichas = []; currentId = null; }
  renderList();
  renderForm();
  updatePreview();
  setSaveIndicator('idle');
}
init();
</script>
